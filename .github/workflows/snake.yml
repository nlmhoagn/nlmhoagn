name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#aa42ff

      - name: Push Snake SVG to output branch
        run: |
          git config --global user.name "Hoang Nguyen"
          git config --global user.email "nlmhoangdt@gmail.com"
          git checkout --orphan output
          git rm -rf . 2>/dev/null || true
          mv dist/*.svg .
          rm -rf dist
          git add *.svg
          git commit -m "chore: update snake animation"
          git push origin output --force